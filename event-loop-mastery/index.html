<!-- The goal is to build a simple logger that shows the execution order in real time page -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Loop Visualizer</title>
</head>
<body>
    <header>
        <h1>Header resides here</h1>
    </header>
    <main>
        <section>
            <button id="btn-basic" style="padding: 10px; margin: 10px; background-color: blue;">Run Basic Demo</button>
