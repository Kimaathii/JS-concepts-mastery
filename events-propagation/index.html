<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Propagation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="control-section">
        <label for="">
        <input type="checkbox" id="capture-toggle" >
            Enable Capturing Phase
        </label>
        <label for="">
        <input type="checkbox" id="stop-propagation" >
                    Stop Propagation at Child
        </label>
        <button  id="clear-log">Clear logs</button>
    </div>
    <div id="grandparent">
            GRANDPARENT (aquamarine)
        <div id="parent">
            PARENT (aqua)
            <div id="child">
            CHILD (bisque)
                <button id="target">Click Me!</button>
            </div>
        </div>
    </div>
    <div id="event-log">
        
    </div>

    <script src="event-demo.js"></script>
</body>
</html>
